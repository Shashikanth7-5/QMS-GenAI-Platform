services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (run: python -c \"import secrets; print(secrets.token_urlsafe(64))\")}
      API_V1_KEY: ${API_V1_KEY:?API_V1_KEY must be set for the REST API}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SEED_BUILTIN_USERS: ${SEED_BUILTIN_USERS:-false}
      MOCK_MODE: ${MOCK_MODE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mock-mode}
      AI_BASE_URL: ${AI_BASE_URL:-}
      SF_WEBHOOK_SECRET: ${SF_WEBHOOK_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://qms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/qms}
      CELERY_BROKER_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      UPLOAD_STORAGE_BACKEND: local
      UPLOAD_STORAGE_DIR: /app/uploads
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-qms-workflow@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      AGENT_ALERT_EMAIL: ${AGENT_ALERT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - qms_uploads:/app/uploads

  worker:
    build: .
    command: celery -A services.celery_app:celery_app worker --loglevel=INFO
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      API_V1_KEY: ${API_V1_KEY:?API_V1_KEY must be set}
      SEED_BUILTIN_USERS: ${SEED_BUILTIN_USERS:-false}
      MOCK_MODE: ${MOCK_MODE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mock-mode}
      AI_BASE_URL: ${AI_BASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://qms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/qms}
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_STORAGE_BACKEND: local
      UPLOAD_STORAGE_DIR: /app/uploads
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-qms-workflow@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      AGENT_ALERT_EMAIL: ${AGENT_ALERT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - qms_uploads:/app/uploads

  beat:
    build: .
    command: celery -A services.celery_app:celery_app beat --loglevel=INFO
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      API_V1_KEY: ${API_V1_KEY:?API_V1_KEY must be set}
      SEED_BUILTIN_USERS: ${SEED_BUILTIN_USERS:-false}
      MOCK_MODE: ${MOCK_MODE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mock-mode}
      AI_BASE_URL: ${AI_BASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://qms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/qms}
      CELERY_BROKER_URL: redis://redis:6379/0
      AGENT_SUPERVISOR_INTERVAL_SECONDS: ${AGENT_SUPERVISOR_INTERVAL_SECONDS:-1200}
      AGENT_SUPERVISOR_LIMIT: ${AGENT_SUPERVISOR_LIMIT:-50}
      AGENT_SUPERVISOR_ALLOW_WEEKEND: ${AGENT_SUPERVISOR_ALLOW_WEEKEND:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-qms-workflow@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      AGENT_ALERT_EMAIL: ${AGENT_ALERT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - qms_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms -d qms"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  qms_pgdata:
  qms_uploads:
